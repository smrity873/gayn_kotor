{% extends "base.html" %}

{% block title %}Password Reset Complete - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-6 py-16">
    <div class="rounded-2xl border border-green-100 bg-card p-8 text-center shadow-xl dark:border-green-900/60 dark:bg-card-dark">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-green-600 text-3xl shadow-lg shadow-green-600/30">✓</div>
        <h1 class="mt-4 text-2xl font-bold text-green-900 dark:text-green-50">Password Reset Complete</h1>
        <p class="mt-2 text-sm text-green-900/70 dark:text-green-100/70">
            Your password has been successfully reset. You may now log in with your new password.
        </p>
        <div class="mt-8">
            <a href="{% url 'accounts:login' %}"
               class="inline-block rounded-full bg-green-600 px-6 py-2.5 font-semibold text-white shadow-lg shadow-green-600/30 transition hover:bg-green-700">
                Log In
            </a>
        </div>
    </div>
</section>
{% endblock %}
